<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deal Checklists</title>
<script>
  // old links like ?state=WV&side=listing go straight to the state page
  (function(){var p=new URLSearchParams(location.search),s=(p.get("state")||"").toLowerCase();
  if(["md","va","wv","pa","dc"].indexOf(s)>-1){p.delete("state");var q=p.toString();location.replace(s+"/"+(q?"?"+q:""));}})();
</script>
<style>
  body{margin:0;background:#f4f6fa;color:#14213d;font:20px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:720px;padding:24px 16px}
  h1{font-size:2rem;margin:0 0 6px}
  p{margin:0 0 20px;color:#4a5670}
  nav{display:flex;flex-direction:column;gap:12px}
  a{display:block;padding:18px 20px;background:#fff;border:2px solid #1f3a6e;border-radius:10px;color:#1f3a6e;font-weight:700;font-size:1.3rem;text-decoration:none}
  a:hover{background:#1f3a6e;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>Deal Checklists</h1>
  <p>Weichert, Realtors – Blue Ribbon. Pick your state.</p>
  <nav>
    <a href="md/">Maryland</a>
    <a href="va/">Virginia</a>
    <a href="wv/">West Virginia</a>
    <a href="pa/">Pennsylvania</a>
    <a href="dc/">Washington, DC</a>
  </nav>
</div>
</body>
</html>
