<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maryland Deal Checklists</title>
<style>
  :root{
    --navy:#0b2540; --navy2:#123a63; --gold:#c9a227; --ink:#111; --muted:#5b6b7c;
    --line:#dfe6ee; --bg:#f4f7fb; --card:#ffffff; --ok:#1c7a3d; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.5}
  .wrap{max-width:900px;margin:0;padding:20px 16px 80px}
  h1{color:var(--navy);font-size:30px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .pickers{display:flex;flex-wrap:wrap;gap:14px;background:var(--card);border:2px solid var(--navy);border-radius:8px;padding:14px 16px;margin-bottom:18px}
  .pickers label{display:block;font-weight:800;color:var(--navy);font-size:15px;margin-bottom:4px}
  .pickers select{font-size:19px;padding:9px 10px;border:1px solid #c8d2dc;border-radius:7px;background:#fff;min-width:200px}
  .pickers [hidden]{display:none}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 14px}
  .progress{font-weight:800;color:var(--navy);font-size:18px}
  button{font-size:16px;font-weight:700;padding:9px 16px;border-radius:7px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
  button.primary{background:var(--navy);color:#fff}
  .note{background:#fff8e1;border-left:5px solid var(--gold);padding:10px 14px;border-radius:6px;margin:0 0 16px;font-size:16px}
  .note[hidden]{display:none}
  section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px 6px;margin-bottom:16px}
  section h2{color:var(--navy);font-size:20px;margin:0 0 8px}
  ul{list-style:none;margin:0;padding:0}
  li{border-top:1px solid var(--line)}
  li:first-child{border-top:0}
  li label{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;cursor:pointer}
  li input{width:22px;height:22px;margin-top:3px;flex:0 0 auto}
  .name{font-weight:700}
  .when{display:block;font-size:15px;color:var(--warn);font-weight:700}
  .src{display:block;font-size:14px;color:var(--muted)}
  li.done .name{color:var(--ok);text-decoration:line-through}
  footer{color:var(--muted);font-size:14px;margin-top:20px}
  @media print{
    .pickers,.bar button{display:none}
    body{background:#fff;font-size:13px}
    section{break-inside:avoid;border-color:#999}
  }
.kq{margin:6px 0 4px 34px;font-size:1.05rem}
.kq summary{cursor:pointer;font-weight:700;color:#1f3a6e;padding:6px 0}
.kq ul{margin:4px 0 8px 20px;padding:0;list-style:disc}
.kq li{margin:4px 0;border:0;padding:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Maryland Deal Checklists</h1>
  <p class="sub">Weichert, Realtors – Blue Ribbon. Pick the side. Check off each document as it's in the file.</p>

  <div class="pickers">
    <select id="state" hidden><option value="MD">Maryland</option></select>
    <div id="countyWrap">
      <label for="county">MD county</label>
      <select id="county">
        <option value="PG">Prince George's</option>
        <option value="MC">Montgomery</option>
        <option value="FR">Frederick</option>
        <option value="OTHER">Other MD county</option>
      </select>
    </div>
    <div>
      <label for="side">Side</label>
      <select id="side">
        <option value="buyer">Buyer (purchase)</option>
        <option value="listing">Listing</option>
        <option value="rental">Rental (lease)</option>
      </select>
    </div>
  </div>

  <div class="bar">
    <span class="progress" id="progress"></span>
    <button type="button" id="clearBtn">Clear checks</button>
    <button type="button" class="primary" onclick="window.print()">Print / Save PDF</button>
  </div>

  <p class="note" id="draftNote" hidden>Starter list. Still being confirmed by compliance. Ask Gavin if a deal doesn't fit.</p>

  <div id="lists"></div>

  <footer id="foot"></footer>
</div>

<script>
/* Each item: [name, when-it-applies (blank = every deal), source] */
const BROKERAGE_BUYER = {
  title: "Brokerage requirements (every state)",
  items: [
    ["MLS sheet (current Bright listing printout)", "", "Brokerage policy"],
    ["Affiliated Business Arrangement (RESPA) disclosure", "", "Brokerage policy – every deal"],
    ["Lender pre-approval letter or proof of funds", "", "Brokerage policy"],
    ["Copy of earnest money deposit (check or wire receipt)", "", "Brokerage policy"],
    ["Equal Housing Opportunity form", "", "Thomas's SOP"],
    ["“For Your Protection: Get a Home Inspection” (HUD)", "FHA loans", "Thomas's SOP"],
    ["Pre-settlement walk-through form", "Before closing", "Thomas's SOP"],
    ["Closing Disclosure / ALTA settlement statement", "At closeout", "Thomas's SOP"],
    ["PA Disclosure of Financial Interest", "Buyer uses Heather Adams / Revolution Mortgage", "Brokerage policy"]
  ]
};
const BROKERAGE_LISTING = {
  title: "Brokerage requirements (every state)",
  items: [
    ["MLS sheet (current Bright listing printout)", "", "Brokerage policy"],
    ["Bright MLS disclosures and seller options", "", "Thomas's SOP"],
    ["Affiliated Business Arrangement (RESPA) disclosure", "", "Brokerage policy – every deal"],
    ["Equal Housing Opportunity form", "", "Thomas's SOP"],
    ["Closing Disclosure / ALTA settlement statement", "At closeout", "Thomas's SOP"]
  ]
};

const DATA = {
  MD: {
    draft: false,
    buyer: [
      { title: "Every deal", items: [
        ["MAR Residential Contract of Sale (10/24)", "", "MAR / PGCAR #101"],
        ["MAR Exclusive Buyer/Tenant Residential Brokerage Agreement", "", "MAR / Thomas's SOP"],
        ["Notice to Buyer and Seller of Buyer's Rights and Seller's Obligations", "Unless property is exempt", "MAR / PGCAR #101"],
        ["MD Residential Property Disclosure/Disclaimer Statement", "Unless property is exempt (seller provides)", "MREC / PGCAR #101"],
        ["Disclosure of Inclusions/Exclusions, Leased Items and Utilities Addendum", "", "MAR / PGCAR #101 (seller provides)"],
        ["Property Inspections Notice", "", "MAR / Thomas's SOP"]
      ]},
      { title: "When it applies", items: [
        ["Federal Lead-Based Paint Disclosure + EPA pamphlet", "Built before 1978", "Federal law"],
        ["MD Lead Poisoning Prevention Program Disclosure", "Built before 1978 and was or will be a rental", "MD law"],
        ["Conventional Financing Addendum", "Conventional loan", "MAR"],
        ["FHA Financing Addendum", "FHA loan", "MAR"],
        ["VA Financing Addendum", "VA loan", "MAR"],
        ["Consent for Dual Agency", "Dual agency", "MREC"],
        ["Understanding Whom Real Estate Agents Represent", "A party is unrepresented", "MREC / Thomas's SOP"],
        ["Water Quality Test Addendum + Notice", "Private well", "MAR contract"],
        ["Deferred Water and Sewer Charges Notice", "Property has deferred water/sewer charges", "MAR contract"],
        ["HOA Act Notice to Buyer", "Property is in an HOA", "MAR / PGCAR #101"],
        ["Condominium Resale Notice", "Condo", "MAR / PGCAR #101"],
        ["Purchase Price Escalation Addendum", "Escalation offer", "MAR / Thomas's SOP"],
        ["Property Inspections Addendum", "Inspection contingency", "MAR / PGCAR #101"],
        ["Additional As-Is Provisions Addendum", "As-is sale", "MAR / PGCAR #101"],
        ["Short Sale Addendum", "Short sale", "MAR / PGCAR #101"],
        ["Back-Up Contract Addendum", "Back-up offer", "MAR / PGCAR #101"],
        ["Sale, Financing, Settlement or Lease of Other Real Estate Addendum", "Buyer must sell/settle another home", "MAR / PGCAR #101"],
        ["Disclosure of Licensee Status Addendum", "A buyer or seller holds a real estate license", "MAR / PGCAR #101"],
        ["Escrow Agreement Between Buyer, Seller and Escrow Agent", "Title company holds the deposit", "MAR / PGCAR #101"],
        ["Post-settlement items", "Anything due after settlement", "Thomas's checklist (8/21/26)"]
      ]},
      { title: "Blue Ribbon required", items: [
        ["Loan financing information", "Financed purchase", "Thomas's checklist (8/21/26)"],
        ["Full listing or agent synopsis", "", "Thomas's checklist (8/21/26)"],
        ["Price trend analysis or CMA", "", "Thomas's checklist (8/21/26)"],
        ["Property tax record or public record", "", "Thomas's checklist (8/21/26)"],
        ["Cinch home warranty – accepted or declined", "", "Thomas's checklist (8/21/26)"]
      ]}
    ],
    listing: [
      { title: "Every listing", items: [
        ["MAR Exclusive Right to Sell Residential Brokerage Agreement", "", "MAR"],
        ["MD Residential Property Disclosure/Disclaimer Statement", "Unless property is exempt", "MREC"],
        ["Disclosure of Inclusions/Exclusions, Leased Items and Utilities Addendum", "", "MAR"],
        ["Notice to Buyer and Seller of Buyer's Rights and Seller's Obligations", "Unless property is exempt", "MAR"],
        ["MD Lead Poisoning Prevention Program Disclosure", "", "Thomas's checklist (9/25) – not optional"],
        ["Financial Condition of Property Disclosure Addendum", "", "Thomas's checklist (9/25) – not optional"]
      ]},
      { title: "When it applies", items: [
        ["Federal Lead-Based Paint Disclosure", "Built before 1978", "Federal law"],
        ["Consent for Dual Agency", "Dual agency", "MREC"],
        ["Short Sale Addendum to the Listing", "Short sale", "MAR"],
        ["HOA / Condo resale documents", "HOA or condo", "MAR"]
      ]},
      { title: "Blue Ribbon required", items: [
        ["Price trend analysis or CMA", "", "Thomas's checklist (9/25)"],
        ["Property tax record or public record", "", "Thomas's checklist (9/25)"],
        ["Seller estimated cost worksheet (net sheet)", "", "Thomas's checklist (9/25)"],
        ["Cinch home protection plan – accepted or declined", "", "Thomas's checklist (9/25)"],
        ["Referral form", "Referral deal", "Thomas's checklist (9/25)"]
      ]}
    ],
    rental: [
      { title: "Every rental", items: [
        ["Residential lease agreement", "", "Thomas's checklist (9/25)"],
        ["Buyer/tenant agency agreement", "", "Thomas's checklist (9/25)"],
        ["Affiliated Business Arrangement (RESPA) disclosure", "", "Thomas's checklist (9/25)"],
        ["Equal Housing Opportunity form", "", "Thomas's checklist (9/25)"],
        ["First month's rent (our listing) or Blue Ribbon's share from the listing broker", "", "Thomas's checklist (9/25)"]
      ]},
      { title: "When it applies", items: [
        ["Consent for Dual Agency", "Dual agency", "Thomas's checklist (9/25)"],
        ["Federal Lead-Based Paint Disclosure + lead paint addendum to the lease", "Built before 1978", "Thomas's checklist (9/25)"],
        ["Lead-based paint brochure given to the client", "Built before 1978", "Thomas's checklist (9/25)"],
        ["County or city lease addenda", "As the jurisdiction requires", "Thomas's checklist (9/25)"]
      ]},
      { title: "Blue Ribbon required", items: [
        ["Bright MLS printout", "", "Thomas's checklist (9/25)"],
        ["Tax or public record", "", "Thomas's checklist (9/25)"],
        ["Copy of the rental application", "", "Thomas's checklist (9/25)"],
        ["Copy of the security deposit", "", "Thomas's checklist (9/25)"],
        ["Copy of the first month's rent", "", "Thomas's checklist (9/25)"]
      ]}
    ],
    county: {
      PG: {
        buyer: { title: "Prince George's County add-ons", items: [
          ["PGCAR 1302 Prince George's County Disclosure and Notice Addendum (DNA)", "", "PGCAR #101 – seller provides"],
          ["PGCAR 1336 Notice to Seller/Buyer – Utility Cost", "Buyer asks in writing for 12 months of utility usage", "PG County Code 13.1107"],
          ["Buyer Acknowledgement of Potential Adverse Consequences", "", "Thomas's SOP"],
          ["Bowie office fee disclosure", "", "Thomas's SOP"]
        ]},
        listing: { title: "Prince George's County add-ons", items: [
          ["PGCAR 1302 Prince George's County Disclosure and Notice Addendum (DNA)", "", "PGCAR – complete at listing"],
          ["PGCAR 1206 Jurisdictional Addendum to the Exclusive Right to Sell", "", "PGCAR"],
          ["Bowie office fee disclosure", "", "Thomas's SOP"]
        ]}
      },
      MC: {
        buyer: { title: "Montgomery County add-ons", items: [
          ["GCAAR 1322 MC Jurisdictional Addendum to the MAR Contract", "Using the MAR contract", "GCAAR"],
          ["GCAAR 1312 MC Jurisdictional Addendum to the GCAAR Contract", "Using the GCAAR 1301 contract instead", "GCAAR"],
          ["GCAAR 900 Regulations, Easements and Assessments (REA) Disclosure", "", "GCAAR – seller provides"],
          ["GCAAR 1383 Tenancy Addendum", "Property is tenant-occupied", "GCAAR"],
          ["Bowie office fee disclosure", "", "Thomas's SOP"]
        ]},
        listing: { title: "Montgomery County add-ons", items: [
          ["GCAAR 909 MC Jurisdictional Addendum to the Listing Agreement", "", "GCAAR – required"],
          ["GCAAR 900 Regulations, Easements and Assessments (REA) Disclosure", "", "GCAAR – required"],
          ["Bowie office fee disclosure", "", "Thomas's SOP"]
        ]}
      },
      FR: {
        buyer: { title: "Frederick County add-ons", items: [
          ["Frederick County Notices and Disclosures", "", "FCAR"],
          ["Frederick City Disclosure Statement", "Property is in the City of Frederick", "FCAR"]
        ]},
        listing: { title: "Frederick County add-ons", items: [
          ["Frederick County Notices and Disclosures", "", "FCAR"],
          ["Frederick City Disclosure Statement", "Property is in the City of Frederick", "FCAR"]
        ]}
      },
      OTHER: null
    }
  }
};

const $ = id => document.getElementById(id);
const checked = new Set();

function params(){
  const p = new URLSearchParams(location.search);
  if (p.get("state") && DATA[p.get("state").toUpperCase()]) $("state").value = p.get("state").toUpperCase();
  if (p.get("county")) $("county").value = p.get("county").toUpperCase();
  if (p.get("side")) $("side").value = p.get("side").toLowerCase();
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const st = $("state").value, side = $("side").value, cty = $("county").value;
  const d = DATA[st];
  $("countyWrap").hidden = st !== "MD";
  $("draftNote").hidden = !d.draft;

  const groups = [...d[side]];
  if (st === "MD" && d.county[cty] && d.county[cty][side]) groups.push(d.county[cty][side]);
  if (!d.workflow && side !== "rental") groups.push(side === "buyer" ? BROKERAGE_BUYER : BROKERAGE_LISTING);

  let html = "";
  groups.forEach((g, gi) => {
    html += `<section><h2>${esc(g.title)}</h2><ul>`;
    g.items.forEach((it, ii) => {
      const key = `${st}|${side}|${cty}|${gi}|${ii}`;
      const on = checked.has(key);
      html += `<li class="${on ? "done" : ""}"><label>
        <input type="checkbox" data-key="${key}" ${on ? "checked" : ""}>
        <span><span class="name">${esc(it[0])}</span>
        ${it[1] ? `<span class="when">When: ${esc(it[1])}</span>` : ""}
        <span class="src">${esc(it[2])}</span></span></label>${it[3] ? `<details class="kq"><summary>Key questions</summary><ul>${it[3].map(q => `<li>${esc(q)}</li>`).join("")}</ul></details>` : ""}</li>`;
    });
    html += `</ul></section>`;
  });
  $("lists").innerHTML = html;
  updateProgress();

  const q = new URLSearchParams({ side, ...(st === "MD" ? { county: cty } : {}) });
  history.replaceState(null, "", "?" + q.toString());
}

function updateProgress(){
  const boxes = document.querySelectorAll("#lists input");
  const done = [...boxes].filter(b => b.checked).length;
  $("progress").textContent = `${done} of ${boxes.length} checked`;
}

$("lists").addEventListener("change", e => {
  const b = e.target;
  if (!b.dataset.key) return;
  b.checked ? checked.add(b.dataset.key) : checked.delete(b.dataset.key);
  b.closest("li").classList.toggle("done", b.checked);
  updateProgress();
});
["state","county","side"].forEach(id => $(id).addEventListener("change", render));
$("clearBtn").addEventListener("click", () => { checked.clear(); render(); });

$("foot").textContent = "Sources: Maryland REALTORS forms, PGCAR #101 Sales Contract Checklist (Rev. 4/23), GCAAR checklists, WVREC Notice of Agency Relationship (rev. 10/2024), Blue Ribbon C1/C2 ACDCS checklists (7/2026), and the brokerage dotloop SOP. Last updated October 2026.";

params();
render();
</script>
</body>
</html>
